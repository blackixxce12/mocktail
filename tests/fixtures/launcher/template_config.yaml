# Mocktail configuration (stand-in first-run template for the editor tests).
# Only sections and keys the runtime loader already knows, so the copied
# sections stay valid whatever the shipped template adds later.

# Integer: configuration schema version. Only version 1 is supported.
version: 1

graphics:
  # String (default: direct-vulkan): graphics backend.
  backend: direct-vulkan
  # Optional presentation synchronization override: auto, on, or off.
  # vsync: off

performance:
  # Boolean (default: false): size Roblox queues from every physical core.
  multithreaded_rendering: false
  # String (default: auto): request Feral GameMode: auto, on, or off.
  gamemode: auto

# Sound devices.
audio:
  # String (default: default): output device name printed during startup.
  output_device: default
  # String (default: default): input device name, id:<number>, or disabled.
  # input_device: disabled

integrations:
  discord_rpc:
    # Boolean (default: false): publish Mocktail activity to Discord Desktop.
    enabled: false

window:
  # Integer (default: 1280): initial window width in logical desktop units.
  width: 1280

network:
  # Boolean (default: false): follow the host HTTP/SOCKS5 proxy.
  use_system_proxy: false

# Roblox updates.
updates:
  # Boolean (default: true): install verified Roblox updates automatically.
  automatic: true
  # String (default: apk-pure): APK provider. Supported values: auto, apk-pure.
  # source: auto
